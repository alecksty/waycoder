<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sky Strike 苍穹突袭</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ============ 游戏画布容器 ============ -->
<div id="game-container">
  <canvas id="game-canvas"></canvas>

  <!-- ============ 覆盖层（菜单/结算均在此） ============ -->
  <div id="overlay" class="overlay hidden">
    <div class="panel">
      <h1 id="overlay-title">SKY STRIKE</h1>
      <div id="overlay-subtitle">苍穹突袭</div>
      <div id="overlay-body" class="overlay-body"></div>
      <div id="overlay-actions" class="overlay-actions"></div>
    </div>
  </div>

  <!-- 移动端触控提示 -->
  <div id="touch-hint" class="hidden">按住屏幕拖动控制飞机</div>
</div>

<!-- ============ 脚本加载（顺序即依赖顺序） ============ -->
<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/input.js"></script>
<script src="js/audio.js"></script>
<script src="js/background.js"></script>
<script src="js/particle.js"></script>
<script src="js/bullet.js"></script>
<script src="js/enemy.js"></script>
<script src="js/player.js"></script>
<script src="js/wave.js"></script>
<script src="js/ui.js"></script>
<script src="js/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
