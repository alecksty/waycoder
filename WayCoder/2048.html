<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>2048</title>
<style>
  :root {
    --bg: #faf8ef;
    --board: #bbada0;
    --cell: #cdc1b4;
    --text: #776e65;
    --tile-2: #eee4da;
    --tile-4: #ede0c8;
    --tile-8: #f2b179;
    --tile-16: #f59563;
    --tile-32: #f67c5f;
    --tile-64: #f65e3b;
    --tile-128: #edcf72;
    --tile-256: #edcc61;
    --tile-512: #edc850;
    --tile-1024: #edc53f;
    --tile-2048: #edc22e;
    --tile-super: #3c3a32;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    color: var(--text);
    -webkit-user-select: none;
    user-select: none;
  }
  .game { width: 500px; max-width: 94vw; padding: 20px 0; }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .title { font-size: 56px; font-weight: 800; color: var(--text); }
  .scores { display: flex; gap: 10px; }
  .score-box {
    background: var(--board);
    color: #fff;
    border-radius: 8px;
    padding: 6px 18px;
    text-align: center;
    min-width: 80px;
  }
  .score-box .label { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; opacity: .85; }
  .score-box .value { font-size: 22px; font-weight: 700; }
  .sub { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .desc { font-size: 14px; opacity: .8; }
  button {
    background: #8f7a66;
    color: #f9f6f2;
    border: none;
    border-radius: 6px;
    padding: 10px 18px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s;
  }
  button:hover { background: #9f8b77; }
  button:active { transform: translateY(1px); }
  .board {
    position: relative;
    background: var(--board);
    border-radius: 10px;
    padding: 12px;
    aspect-ratio: 1 / 1;
    touch-action: none;
  }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 12px; height: 100%; }
  .cell { background: var(--cell); border-radius: 6px; }
  .tile-layer { position: absolute; inset: 12px; pointer-events: none; }
  .tile {
    position: absolute;
    border-radius: 6px;
    display: flex;
    justify-content: center;
    align-items: center;
    font-weight: 800;
    transition: top .12s ease, left .12s ease;
    animation: pop .18s ease;
  }
  @keyframes pop {
    0% { transform: scale(.5); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }
  .tile.merged { animation: merge .2s ease; }
  @keyframes merge {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
  }
  .overlay {
    position: absolute;
    inset: 0;
    background: rgba(238, 228, 218, .73);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 18px;
    opacity: 0;
    pointer-events: none;
    transition: opacity .25s;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .overlay .msg { font-size: 42px; font-weight: 800; color: var(--text); }
  .overlay.win .msg { color: #f65e3b; }
</style>
</head>
<body>
<div class="game">
  <div class="header">
    <div class="title">2048</div>
    <div class="scores">
      <div class="score-box"><div class="label">分数</div><div class="value" id="score">0</div></div>
      <div class="score-box"><div class="label">最佳</div><div class="value" id="best">0</div></div>
    </div>
  </div>
  <div class="sub">
    <div class="desc">方向键 / WASD / 滑动 移动，合并相同数字达到 <b>2048</b>！</div>
    <button id="newGame">新游戏</button>
  </div>
  <div class="board" id="board">
    <div class="grid" id="grid"></div>
    <div class="tile-layer" id="tiles"></div>
    <div class="overlay" id="overlay"><div class="msg" id="msg"></div><button id="again">再来一局</button></div>
  </div>
</div>

<script>
(() => {
  const SIZE = 4;
  const boardEl = document.getElementById('board');
  const gridEl = document.getElementById('grid');
  const tilesEl = document.getElementById('tiles');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const msg = document.getElementById('msg');

  let cells = [];       // 4x4 数字矩阵，0 表示空
  let score = 0;
  let best = Number(localStorage.getItem('best2048') || 0);
  let won = false;
  let over = false;
  let moving = false;

  // 构建静态网格背景
  for (let i = 0; i < SIZE * SIZE; i++) {
    const c = document.createElement('div');
    c.className = 'cell';
    gridEl.appendChild(c);
  }

  function emptyCells() {
    const list = [];
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++)
        if (cells[r][c] === 0) list.push([r, c]);
    return list;
  }

  function addRandom() {
    const list = emptyCells();
    if (!list.length) return;
    const [r, c] = list[Math.floor(Math.random() * list.length)];
    cells[r][c] = Math.random() < 0.9 ? 2 : 4;
  }

  function start() {
    cells = Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
    score = 0;
    won = false;
    over = false;
    overlay.classList.remove('show');
    overlay.classList.remove('win');
    addRandom();
    addRandom();
    render();
  }

  function tileStyle(v) {
    const colors = {
      2: '#eee4da', 4: '#ede0c8', 8: '#f2b179', 16: '#f59563',
      32: '#f67c5f', 64: '#f65e3b', 128: '#edcf72', 256: '#edcc61',
      512: '#edc850', 1024: '#edc53f', 2048: '#edc22e'
    };
    let bg = colors[v] || '#3c3a32';
    let color = (v <= 4) ? '#776e65' : '#f9f6f2';
    let size = v < 100 ? 38 : v < 1000 ? 32 : 26;
    return { bg, color, size };
  }

  function render() {
    scoreEl.textContent = score;
    bestEl.textContent = best;
    tilesEl.innerHTML = '';
    const gap = 12;
    const boardSize = boardEl.clientWidth - 24; // padding 12*2
    const cellSize = (boardSize - gap * (SIZE + 1)) / SIZE;

    for (let r = 0; r < SIZE; r++) {
      for (let c = 0; c < SIZE; c++) {
        const v = cells[r][c];
        if (!v) continue;
        const t = document.createElement('div');
        t.className = 'tile';
        const s = tileStyle(v);
        t.textContent = v;
        t.style.width = cellSize + 'px';
        t.style.height = cellSize + 'px';
        t.style.top = (gap + r * (cellSize + gap)) + 'px';
        t.style.left = (gap + c * (cellSize + gap)) + 'px';
        t.style.background = s.bg;
        t.style.color = s.color;
        t.style.fontSize = s.size + 'px';
        tilesEl.appendChild(t);
      }
    }
  }

  // 处理一次移动，返回是否有变化
  function move(dir) {
    let moved = false;
    const vectors = { left: [0, -1], right: [0, 1], up: [-1, 0], down: [1, 0] };
    const [dr, dc] = vectors[dir];

    const order = (n) =>
      dir === 'right' || dir === 'down'
        ? Array.from({ length: n }, (_, i) => n - 1 - i)
        : Array.from({ length: n }, (_, i) => i);

    // 每行/列作为一条线滑动合并
    const lines = [];
    for (let i = 0; i < SIZE; i++) {
      const line = [];
      for (let j = 0; j < SIZE; j++) {
        const r = dir === 'up' || dir === 'down' ? j : i;
        const c = dir === 'up' || dir === 'down' ? i : j;
        line.push(cells[r][c]);
      }
      lines.push({ i, line });
    }

    const newCells = cells.map(row => row.slice());

    lines.forEach(({ i, line }) => {
      // 压缩非零
      let vals = line.filter(v => v !== 0);
      // 合并相邻相等
      const merged = [];
      for (let k = 0; k < vals.length; k++) {
        if (k + 1 < vals.length && vals[k] === vals[k + 1]) {
          const nv = vals[k] * 2;
          merged.push(nv);
          score += nv;
          if (nv === 2048) won = true;
          k++;
        } else {
          merged.push(vals[k]);
        }
      }
      // 补零到原长度
      while (merged.length < SIZE) merged.push(0);
      // 按方向顺序写回
      const o = order(SIZE);
      let idx = 0;
      for (let j of o) {
        const r = dir === 'up' || dir === 'down' ? j : i;
        const c = dir === 'up' || dir === 'down' ? i : j;
        if (newCells[r][c] !== merged[idx]) moved = true;
        newCells[r][c] = merged[idx];
        idx++;
      }
    });

    if (moved) cells = newCells;
    return moved;
  }

  function canMove() {
    if (emptyCells().length) return true;
    for (let r = 0; r < SIZE; r++)
      for (let c = 0; c < SIZE; c++) {
        const v = cells[r][c];
        if (r + 1 < SIZE && cells[r + 1][c] === v) return true;
        if (c + 1 < SIZE && cells[r][c + 1] === v) return true;
      }
    return false;
  }

  function step(dir) {
    if (over || moving) return;
    moving = true;
    const moved = move(dir);
    if (moved) addRandom();
    if (score > best) { best = score; localStorage.setItem('best2048', best); }
    render();
    if (won && !overlay.classList.contains('win')) {
      overlay.classList.add('show', 'win');
      msg.textContent = '你赢了！🎉';
    } else if (!canMove()) {
      over = true;
      overlay.classList.add('show');
      overlay.classList.remove('win');
      msg.textContent = '游戏结束！';
    }
    setTimeout(() => { moving = false; }, 120);
  }

  // 键盘控制
  const keyMap = {
    ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
    a: 'left', d: 'right', w: 'up', s: 'down',
    A: 'left', D: 'right', W: 'up', S: 'down'
  };
  window.addEventListener('keydown', e => {
    if (e.key in keyMap) {
      e.preventDefault();
      step(keyMap[e.key]);
    }
  });

  // 触摸/鼠标滑动
  let startX = 0, startY = 0, touching = false;
  boardEl.addEventListener('touchstart', e => {
    const t = e.touches[0];
    startX = t.clientX; startY = t.clientY; touching = true;
  }, { passive: true });
  boardEl.addEventListener('mousedown', e => {
    startX = e.clientX; startY = e.clientY; touching = true;
  });
  window.addEventListener('touchend', e => {
    if (!touching) return;
    const t = e.changedTouches[0];
    handleSwipe(t.clientX - startX, t.clientY - startY);
  }, { passive: true });
  window.addEventListener('mouseup', e => {
    if (!touching) return;
    handleSwipe(e.clientX - startX, e.clientY - startY);
  });

  function handleSwipe(dx, dy) {
    touching = false;
    const absX = Math.abs(dx), absY = Math.abs(dy);
    if (Math.max(absX, absY) < 24) return;
    if (absX > absY) step(dx > 0 ? 'right' : 'left');
    else step(dy > 0 ? 'down' : 'up');
  }

  document.getElementById('newGame').addEventListener('click', start);
  document.getElementById('again').addEventListener('click', start);
  window.addEventListener('resize', render);

  bestEl.textContent = best;
  start();
})();
</script>
</body>
</html>
