<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>🐍 贪吃蛇</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh; background: #1a1a2e; font-family: 'Segoe UI', sans-serif;
  flex-direction: column; gap: 16px;
}
#ui {
  display: flex; gap: 32px; align-items: center; color: #eee; font-size: 18px;
}
#ui span { background: #16213e; padding: 6px 18px; border-radius: 8px; }
canvas {
  border-radius: 12px;
  box-shadow: 0 0 40px rgba(0, 200, 150, 0.3);
}
#msg {
  color: #aaa; font-size: 14px;
}
#overlay {
  position: absolute; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 12px;
  color: #fff; font-size: 28px; font-weight: bold;
  pointer-events: none;
}
#overlay.hidden { display: none; }
#overlay button {
  pointer-events: all; font-size: 18px; padding: 10px 32px;
  border: none; border-radius: 8px; background: #0f3460; color: #fff;
  cursor: pointer; transition: background .2s;
}
#overlay button:hover { background: #e94560; }
</style>
</head>
<body>
<div id="ui">
  <span>🏆 分数: <b id="score">0</b></span>
  <span>⚡ 最高: <b id="best">0</b></span>
</div>
<div style="position:relative">
  <canvas id="c" width="480" height="480"></canvas>
  <div id="overlay">
    <div id="overlayText">🐍 贪吃蛇</div>
    <button id="btn">开始游戏</button>
  </div>
</div>
<div id="msg">方向键 / WASD 控制方向</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const overlayText = document.getElementById('overlayText');
const btn = document.getElementById('btn');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');

const GRID = 20;
const COLS = canvas.width / GRID;
const ROWS = canvas.height / GRID;

let snake, dir, nextDir, food, score, best = 0, running = false, timer;

function init() {
  snake = [{x:10,y:12},{x:9,y:12},{x:8,y:12}];
  dir = {x:1,y:0};
  nextDir = {x:1,y:0};
  score = 0;
  scoreEl.textContent = 0;
  placeFood();
}

function placeFood() {
  do {
    food = { x: Math.floor(Math.random()*COLS), y: Math.floor(Math.random()*ROWS) };
  } while (snake.some(s => s.x === food.x && s.y === food.y));
}

function update() {
  dir = nextDir;
  const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

  // 撞墙或撞自己
  if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS ||
      snake.some(s => s.x === head.x && s.y === head.y)) {
    gameOver();
    return;
  }

  snake.unshift(head);

  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = score;
    if (score > best) { best = score; bestEl.textContent = best; }
    placeFood();
  } else {
    snake.pop();
  }
}

function draw() {
  // 背景
  ctx.fillStyle = '#0f3460';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // 网格
  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  for (let i = 0; i <= COLS; i++) {
    ctx.beginPath(); ctx.moveTo(i*GRID, 0); ctx.lineTo(i*GRID, canvas.height); ctx.stroke();
  }
  for (let i = 0; i <= ROWS; i++) {
    ctx.beginPath(); ctx.moveTo(0, i*GRID); ctx.lineTo(canvas.width, i*GRID); ctx.stroke();
  }

  // 食物
  ctx.fillStyle = '#e94560';
  ctx.shadowColor = '#e94560';
  ctx.shadowBlur = 12;
  ctx.beginPath();
  ctx.arc(food.x*GRID + GRID/2, food.y*GRID + GRID/2, GRID/2 - 2, 0, Math.PI*2);
  ctx.fill();
  ctx.shadowBlur = 0;

  // 蛇
  snake.forEach((seg, i) => {
    const ratio = 1 - i / snake.length;
    const g = Math.floor(180 + 75 * ratio);
    ctx.fillStyle = i === 0 ? '#00ff88' : `rgb(0, ${g}, ${Math.floor(100 + 50*ratio)})`;
    ctx.shadowColor = i === 0 ? '#00ff88' : 'transparent';
    ctx.shadowBlur = i === 0 ? 10 : 0;
    roundRect(seg.x*GRID+1, seg.y*GRID+1, GRID-2, GRID-2, 5);
    ctx.fill();
  });
  ctx.shadowBlur = 0;
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.arcTo(x+w, y, x+w, y+h, r);
  ctx.arcTo(x+w, y+h, x, y+h, r);
  ctx.arcTo(x, y+h, x, y, r);
  ctx.arcTo(x, y, x+w, y, r);
  ctx.closePath();
}

function loop() {
  update();
  if (running) draw();
}

function start() {
  init();
  running = true;
  overlay.classList.add('hidden');
  draw();
  timer = setInterval(loop, 120);
}

function gameOver() {
  running = false;
  clearInterval(timer);
  overlayText.textContent = `💀 游戏结束！得分: ${score}`;
  btn.textContent = '再来一局';
  overlay.classList.remove('hidden');
}

btn.addEventListener('click', start);

document.addEventListener('keydown', e => {
  const map = {
    ArrowUp: {x:0,y:-1}, ArrowDown: {x:0,y:1},
    ArrowLeft: {x:-1,y:0}, ArrowRight: {x:1,y:0},
    w: {x:0,y:-1}, s: {x:0,y:1}, a: {x:-1,y:0}, d: {x:1,y:0},
    W: {x:0,y:-1}, S: {x:0,y:1}, A: {x:-1,y:0}, D: {x:1,y:0},
  };
  const nd = map[e.key];
  if (nd && running) {
    // 防止180度掉头
    if (nd.x !== -dir.x || nd.y !== -dir.y) {
      nextDir = nd;
    }
    e.preventDefault();
  }
});

// 初始画面
init();
draw();
</script>
</body>
</html>
