<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="一个简洁的中文 Web 聊天应用">
  <title>聊天应用</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="chat-header">
    <h1>聊天室</h1>
    <p class="chat-subtitle">欢迎来到聊天室，开始你的对话吧</p>
  </header>

  <main class="chat-main">
    <div id="chat-messages" aria-live="polite">
      <!-- 消息由 script.js 动态渲染 -->
    </div>
  </main>

  <footer class="chat-footer">
    <div class="chat-input-area">
      <textarea id="chat-input" rows="1" placeholder="输入消息，按回车发送…" aria-label="消息输入框"></textarea>
      <button id="send-btn" type="button">发送</button>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
