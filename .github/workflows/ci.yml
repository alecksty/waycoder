name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: dotnet build (Release)
        run: dotnet build CoreCoderSharp/CoreCoderSharp.csproj -c Release --nologo

  test:
    name: Self-Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run self-tests
        run: dotnet run -c Release --project CoreCoderSharp/CoreCoderSharp.csproj -- --test

  aot-publish:
    name: NativeAOT Publish Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - name: dotnet publish (NativeAOT)
        run: dotnet publish CoreCoderSharp/CoreCoderSharp.csproj -c Release -r linux-x64 --nologo -v:m
